# Dependabot version updates. Security updates are turned on in the repository settings.
# cooldown: wait 14 days after a release before proposing it, so brand-new versions settle first.
# Major versions are skipped for routine updates because they need planned upgrade work.
# Vulnerabilities still show up as Dependabot alerts in the Security tab whatever the version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
